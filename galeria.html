<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Galería</title>
<style>
:root{--bg:#101114;--bar:#1b1c21;--tx:#eceae4;--mut:#8b8d96;--ac:#7fd6c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#bar{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;background:linear-gradient(var(--bar),rgba(27,28,33,.85));display:flex;justify-content:space-between;align-items:baseline}
#bar h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.2px}
#bar small{color:var(--mut);font-size:13px}
#dot{width:7px;height:7px;border-radius:50%;background:#3a3c44;display:inline-block;margin-left:10px}
#dot.on{background:var(--ac)}
canvas#g{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#nm{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);text-align:center;z-index:4;font-size:26px;font-weight:600;opacity:0;transition:opacity 1.2s;pointer-events:none;text-shadow:0 2px 12px #000}
#nm.v{opacity:1}
#blk{position:fixed;inset:0;background:#000;z-index:20;display:none}
#kid{position:fixed;inset:0;background:#000;z-index:15;display:none}
#kid canvas{width:100%;height:100%;display:block}
#kid button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px}
#cfg{position:fixed;inset:0;z-index:30;background:rgba(10,11,14,.97);padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 24px;overflow:auto;display:block}
#cfg h2{margin:0 0 4px;font-size:24px}
#cfg p{color:var(--mut);margin:0 0 18px;font-size:14px;line-height:1.45}
#cfg label{display:block;margin:0 0 14px;font-size:14px;color:var(--tx)}
#cfg label span{display:block;color:var(--mut);margin-bottom:6px;font-size:13px}
#cfg input[type=file],#cfg input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid #2c2e36;background:#16171c;color:var(--tx);font-size:15px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#06201a;font-size:17px;font-weight:700;margin-top:6px}
.btn.g{background:#23252c;color:var(--tx);font-weight:500;font-size:15px}
#st{margin-top:14px;font-size:13px;color:var(--mut);min-height:18px}
</style>
</head>
<body>
<div id="bar"><h1 id="ttl">Galería</h1><small>Recientes<span id="dot"></span></small></div>
<canvas id="g"></canvas>
<div id="nm"></div>
<div id="blk"></div>
<div id="kid"><canvas id="kc" width="720" height="1280"></canvas><button id="kx" aria-label="Cerrar">✕</button></div>

<div id="cfg">
  <h2>Preparar el truco</h2>
  <p>Carga tus fotos para que la galería parezca real. Después pulsa Empezar. Para volver aquí, mantén pulsado el título «Galería».</p>
  <label><span>Tus fotos (elige varias, hasta 80)</span><input id="fp" type="file" accept="image/*" multiple></label>
  <label><span>Foto del «niño» (si no eliges, se dibuja una)</span><input id="fk" type="file" accept="image/*"></label>
  <label><span>Probar sin voz: escribe un artista</span><input id="ft" type="text" placeholder="Ej. Shakira" autocomplete="off"></label>
  <label><span>Respaldo si no hay internet: foto del artista</span><input id="fa" type="file" accept="image/*"></label>
  <button class="btn g" id="bt">Probar con el texto</button>
  <button class="btn" id="go">Empezar y activar micrófono</button>
  <div id="st"></div>
</div>

<script>
const $=s=>document.getElementById(s),cv=$('g'),ctx=cv.getContext('2d');
let dpr=Math.min(devicePixelRatio||1,2),W,H;
function rs(){W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',rs);rs();
const rnd=n=>Math.floor(Math.random()*n);
const say=t=>$('st').textContent=t;

/* ---------- miniaturas ---------- */
let thumbs=[];
function fake(){const c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d'),h=rnd(360),g=x.createLinearGradient(0,0,0,48);
 g.addColorStop(0,`hsl(${h},55%,68%)`);g.addColorStop(1,`hsl(${h+40},45%,32%)`);x.fillStyle=g;x.fillRect(0,0,48,48);
 x.fillStyle=`hsl(${h+180},70%,82%)`;x.beginPath();x.arc(10+rnd(28),9+rnd(14),5+rnd(7),0,7);x.fill();
 x.fillStyle=`hsl(${h+20},40%,24%)`;x.beginPath();x.moveTo(0,48);x.lineTo(14+rnd(12),22+rnd(12));x.lineTo(48,48);x.fill();return c}
function defaultThumbs(){thumbs=Array.from({length:40},fake)}
async function toThumb(file,S){const b=await createImageBitmap(file),c=document.createElement('canvas');c.width=c.height=S;
 const m=Math.min(b.width,b.height);c.getContext('2d').drawImage(b,(b.width-m)/2,(b.height-m)/2,m,m,0,0,S,S);return c}
$('fp').onchange=async e=>{const fs=[...e.target.files].slice(0,80);say('Preparando fotos…');
 const r=[];for(const f of fs){try{r.push(await toThumb(f,64))}catch(_){}}
 if(r.length){thumbs=r;say(r.length+' fotos listas.')}};

/* ---------- niño ---------- */
let kidImg=null;
function drawKid(){const c=$('kc'),x=c.getContext('2d'),w=c.width,h=c.height;
 if(kidImg){const s=Math.max(w/kidImg.width,h/kidImg.height);x.drawImage(kidImg,(w-kidImg.width*s)/2,(h-kidImg.height*s)/2,kidImg.width*s,kidImg.height*s);return}
 const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#f2c98a');g.addColorStop(1,'#e69a6b');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.fillStyle='#3b82c4';x.beginPath();x.ellipse(w/2,h*.78,230,210,0,0,7);x.fill();
 x.fillStyle='#f4c7a1';x.beginPath();x.arc(w/2,h*.45,190,0,7);x.fill();
 x.fillStyle='#4a2f1c';x.beginPath();x.arc(w/2,h*.40,195,Math.PI,0);x.fill();
 x.fillStyle='#2a1a10';[-1,1].forEach(s=>{x.beginPath();x.arc(w/2+s*70,h*.455,17,0,7);x.fill()});
 x.fillStyle='#e58a8a';[-1,1].forEach(s=>{x.beginPath();x.arc(w/2+s*118,h*.5,26,0,7);x.fill()});
 x.strokeStyle='#8a3b2c';x.lineWidth=9;x.lineCap='round';x.beginPath();x.arc(w/2,h*.50,52,.25,Math.PI-.25);x.stroke()}
$('fk').onchange=async e=>{if(e.target.files[0]){kidImg=await createImageBitmap(e.target.files[0]);say('Foto del niño lista.')}};

/* ---------- mosaico ---------- */
let cols=3,rows=40,cc=null,hasArtist=false,artistName='';
let z=0,tz=0,pan=0,pinching=false,live=false;
function buildGrid(img){
 cols=28;rows=Math.max(10,Math.min(60,Math.round(cols*(img.height/img.width))));
 const c=document.createElement('canvas');c.width=cols;c.height=rows;const x=c.getContext('2d',{willReadFrequently:true});
 x.drawImage(img,0,0,cols,rows);const d=x.getImageData(0,0,cols,rows).data;cc=[];
 for(let i=0;i<cols*rows;i++){const k=i*4,f=v=>Math.max(0,Math.min(255,(v-128)*1.3+128+8))|0;cc.push([f(d[k]),f(d[k+1]),f(d[k+2])])}
 hasArtist=true;z=0;tz=0;pan=0;$('nm').classList.remove('v')}
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function findArtist(q){
 for(const l of['es','en']){
  const u=`https://${l}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=4&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*`;
  const r=await fetch(u).then(r=>r.json()),p=Object.values(r.query?.pages||{}).filter(p=>p.thumbnail).sort((a,b)=>a.index-b.index);
  if(p.length)return{src:p[0].thumbnail.source,title:p[0].title}}
 return null}
const cap=s=>s.replace(/[.,;!?]+$/,'').replace(/\b\p{L}/gu,m=>m.toUpperCase());
async function search(q){
 q=cap(q.trim());artistName=q;hasArtist=false;say('Buscando '+q+'…');showBlack();
 try{const a=await findArtist(q);if(!a)throw 0;const img=await loadImg(a.src);buildGrid(img);$('nm').textContent=q;say('Listo: '+a.title)}
 catch(_){say('No pude traer la foto de «'+q+'». Elige una foto del artista en el respaldo.')}}
$('fa').onchange=async e=>{if(e.target.files[0]){const b=await createImageBitmap(e.target.files[0]);buildGrid(b);$('nm').textContent=artistName||'';say('Foto del artista lista.')}};

/* ---------- flujo ---------- */
function showBlack(){live=false;$('blk').style.display='block';$('cfg').style.display='none'}
$('blk').onclick=()=>{$('blk').style.display='none';drawKid();$('kid').style.display='block'};
$('kx').onclick=()=>{$('kid').style.display='none';live=true;z=0;tz=0;pan=0};
let ty0=null;$('kid').addEventListener('touchstart',e=>ty0=e.touches[0].clientY);
$('kid').addEventListener('touchend',e=>{if(ty0!==null&&Math.abs(e.changedTouches[0].clientY-ty0)>90)$('kx').click();ty0=null});

/* ---------- dibujo ---------- */
function draw(){
 if(!pinching)z+=(tz-z)*.14;
 ctx.fillStyle='#101114';ctx.fillRect(0,0,W,H);
 const N=cols*rows,s0=W/3,s1=Math.min(W/(cols+1),H*.84/rows);
 const s=s0*Math.pow(Math.max(s1/s0,.01),z),gx=W/2-cols*s/2,gy=H/2-rows*s/2+pan*(s/s0)*(1-z)*dpr,gap=2*dpr*(1-z);
 const a=hasArtist?Math.pow(z,1.4)*.76:0,c0=Math.max(0,Math.floor(-gx/s)),c1=Math.min(cols,Math.ceil((W-gx)/s)),r0=Math.max(0,Math.floor(-gy/s)),r1=Math.min(rows,Math.ceil((H-gy)/s));
 for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){
  const i=r*cols+c,x=gx+c*s,y=gy+r*s;
  ctx.drawImage(thumbs[(i*7+r)%thumbs.length],x,y,s-gap,s-gap);
  if(a>.01){const k=cc[i];ctx.fillStyle=`rgba(${k[0]},${k[1]},${k[2]},${a})`;ctx.fillRect(x,y,s-gap,s-gap)}}
 if(hasArtist&&z>.97)$('nm').classList.add('v');else $('nm').classList.remove('v');
 requestAnimationFrame(draw)}

/* ---------- gestos ---------- */
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
let d0=0,z0=0,py=0;
cv.addEventListener('touchstart',e=>{if(!live)return;e.preventDefault();
 if(e.touches.length===2){pinching=true;d0=dist(e.touches);z0=z}else py=e.touches[0].clientY},{passive:false});
cv.addEventListener('touchmove',e=>{if(!live)return;e.preventDefault();
 if(e.touches.length===2&&pinching){z=Math.max(0,Math.min(1,z0+(d0-dist(e.touches))/(innerWidth*.7)));tz=z}
 else if(e.touches.length===1&&z<.05){const y=e.touches[0].clientY;pan+=y-py;py=y;const m=rows*(innerWidth/3)/2;pan=Math.max(-m,Math.min(m,pan))}},{passive:false});
cv.addEventListener('touchend',e=>{if(e.touches.length<2&&pinching){pinching=false;tz=z>.45?1:0}});
cv.addEventListener('wheel',e=>{if(!live)return;e.preventDefault();tz=Math.max(0,Math.min(1,tz+e.deltaY*.002))},{passive:false});

/* ---------- voz ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,on=false;
function handle(t){const m=t.toLowerCase().match(/\b(?:ok|okay|okey|o\.k\.)[,.]?\s+(?:google\s+)?(.{2,})/);if(m)search(m[1])}
function listen(){
 if(!SR){say('Este navegador no tiene reconocimiento de voz. Usa Chrome en Android o Safari en iPhone.');return}
 rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>handle(e.results[e.results.length-1][0].transcript.trim());
 rec.onstart=()=>$('dot').classList.add('on');
 rec.onend=()=>{$('dot').classList.remove('on');if(on)setTimeout(()=>{try{rec.start()}catch(_){}},300)};
 rec.onerror=e=>{if(e.error==='not-allowed'){on=false;say('El micrófono está bloqueado. Permítelo en el navegador y abre la página desde https.')}};
 on=true;try{rec.start()}catch(_){}}
$('go').onclick=()=>{$('cfg').style.display='none';live=true;listen()};
$('bt').onclick=()=>{const v=$('ft').value.trim();if(v)search(v)};
let lp;$('ttl').addEventListener('touchstart',()=>lp=setTimeout(()=>{$('cfg').style.display='block';live=false},800));
$('ttl').addEventListener('touchend',()=>clearTimeout(lp));

defaultThumbs();requestAnimationFrame(draw);
</script>
</body>
</html>
